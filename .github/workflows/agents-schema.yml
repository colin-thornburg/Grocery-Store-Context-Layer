name: Publish dbt Platform Manifest

on:
  workflow_dispatch:
    inputs:
      dbt_run_id:
        description: "Successful dbt Platform production run ID"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Download manifest.json from dbt Platform
        env:
          DBT_HOST: ${{ secrets.DBT_HOST }}
          DBT_ACCOUNT_ID: ${{ secrets.DBT_ACCOUNT_ID }}
          DBT_RUN_ID: ${{ inputs.dbt_run_id }}
          DBT_TOKEN: ${{ secrets.DBT_TOKEN }}
        run: |
          api_base="${DBT_HOST%/}"
          api_base="${api_base%/api/v2}"
          manifest_path="target/manifest.json"
          manifest_url="${api_base}/api/v2/accounts/${DBT_ACCOUNT_ID}/runs/${DBT_RUN_ID}/artifacts/manifest.json"
          temp_manifest="$(mktemp)"

          mkdir -p target

          for candidate_url in \
            "${manifest_url}" \
            "${manifest_url}?step=last"; do
            if curl --fail --location \
              -H "Authorization: Token ${DBT_TOKEN}" \
              -H "Content-Type: application/json" \
              "${candidate_url}" \
              -o "${temp_manifest}"; then
              mv "${temp_manifest}" "${manifest_path}"
              break
            fi
          done

          test -s "${manifest_path}"

      - name: Publish dbt metadata to AGENTS
        env:
          WAREHOUSE_CREDENTIALS: ${{ secrets.WAREHOUSE_CREDENTIALS }}
        run: |
          uvx --from agents-schema==0.0.11 \
            agents-schema dbt --project-dir .
